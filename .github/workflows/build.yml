name: Build JAR

on:
  push:
    branches: [ jadx-ai, ci-build-action ]
  pull_request:
    branches: [ jadx-ai ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install jadx-all into local Maven repo
        run: |
          # Download jadx release and find usable jar
          curl -L "https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip" -o jadx.zip
          unzip -q jadx.zip -d jadx-dist
          echo "Available jars in distribution:"
          find jadx-dist -name "*.jar" | sort

          # Try to find jadx-all or fall back to merging all jadx jars
          JAR=$(find jadx-dist -name "jadx-all*.jar" | head -1)
          if [ -z "$JAR" ]; then
            # No jadx-all jar found, create one by merging all jadx lib jars
            mkdir -p merged-classes
            for j in $(find jadx-dist/lib -name "*.jar"); do
              unzip -qo "$j" -d merged-classes 2>/dev/null || true
            done
            jar cf jadx-all-1.5.3.jar -C merged-classes .
            JAR="jadx-all-1.5.3.jar"
            echo "Created merged jar: $JAR"
          fi

          echo "Installing: $JAR"
          mvn install:install-file \
            -Dfile="$JAR" \
            -DgroupId=io.github.skylot \
            -DartifactId=jadx-all \
            -Dversion=1.5.3 \
            -Dpackaging=jar \
            -q

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-ai-mcp-${{ github.sha }}
          path: target/jadx-ai-mcp-*.jar
          if-no-files-found: error

      - name: Upload JAR to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/jadx-ai-mcp-*.jar
